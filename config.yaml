# How often to check, in hours
check_interval_hours: 3

# SQLite file used to remember jobs already seen
database_path: jobs.db

# On the very first run for a company, all current jobs are saved as the
# baseline. Set to true if you also want an email listing them.
notify_on_first_run: false

# Default keyword filter is intentionally disabled so the monitor fetches all jobs.
# If you want to filter by job title later, add a per-company "keywords:" list
# or set a non-empty "default_keywords:" list here.
default_keywords: []


# render_js (optional, per company):
#   (not set) = auto: plain page first, then a real browser if nothing is found
#               (the browser step needs: pip install playwright && playwright install chromium)
#   false     = never use the browser
#   true      = always use the browser

